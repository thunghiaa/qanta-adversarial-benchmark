[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qanta-adversarial-benchmark"
version = "0.1.0"
description = "Reproducible QANTA model benchmarking and adversarialness analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
inference = [
  "datasets>=2.20",
  "huggingface-hub>=0.24",
  "loguru>=0.7",
  "python-dotenv>=1.0",
]

[project.scripts]
qanta-bench = "qanta_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
